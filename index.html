<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>qwencraft</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:monospace}
  #hud{position:fixed;inset:0;pointer-events:none}
  #cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:20px;text-shadow:0 0 3px #000}
  #hp{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:22px;text-shadow:1px 1px 0 #000}
  #sel{position:absolute;bottom:14px;right:14px;color:#fff;font-size:14px;text-shadow:1px 1px 0 #000}
  #damage{position:fixed;inset:0;background:radial-gradient(transparent 40%,rgba(255,0,0,.6));opacity:0;transition:opacity .4s;pointer-events:none}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
       color:#fff;text-shadow:1px 1px 2px #000;text-align:center;pointer-events:none}
  #msg h1{font-size:40px;margin:0}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="hud" class="hidden">
  <div id="cross">+</div>
  <div id="hp"></div>
  <div id="sel"></div>
</div>
<div id="damage"></div>
<div id="msg">
  <h1>qwencraft</h1>
  <div>WASD move &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; Shift sprint</div>
  <div>Left click: break block / punch enemy</div>
  <div>Right click: place selected block</div>
  <div>1 grass · 2 stone · 3 wood · 4 plank · 5 dirt &nbsp;·&nbsp; R respawn</div>
  <div style="margin-top:10px"><b>(click to start)</b></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
